name: Dogfood

# blastproof testing itself: the agent runs the plain-English suite against the
# bundled demo app in a real browser, scores the result and gates on it.
#
# Deliberately NOT on pull_request. The agentic run costs tokens and is driven by
# an LLM, so it does not belong in the merge path — a flaky model answer must never
# block a merge. It runs on a schedule instead, which keeps the public evidence
# fresh without making anyone wait on it. The free, deterministic impact analysis
# is what runs per PR (see impact.yml).
on:
  schedule:
    # Mondays at 06:00 UTC. Weekly rather than daily: the evidence only needs to be
    # current, not fresh by the hour, and each run spends real tokens. GitHub
    # disables scheduled workflows after 60 days without repository activity; a
    # manual dispatch re-arms them.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      max_llm_calls:
        # Left empty the run is unbounded, which is also the scheduled behaviour.
        # `applyEnvOverrides` skips an empty variable, so passing it through
        # unconditionally cannot make an unbounded run accidentally bounded.
        description: 'Optional model-call ceiling for this run (empty = unbounded)'
        required: false
        default: ''

concurrency:
  group: dogfood
  cancel-in-progress: false

jobs:
  demo-app:
    name: blastproof vs demo-app
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BASE_URL: http://localhost:4173
      MIN_SCORE: 80
      # Point the run at OpenRouter without touching the committed config, whose
      # default stays anthropic. Precedence is CLI flag > environment > file.
      BLASTPROOF_LLM_PROVIDER: openai
      BLASTPROOF_LLM_MODEL: anthropic/claude-haiku-4.5
      BLASTPROOF_LLM_BASE_URL: https://openrouter.ai/api/v1
      BLASTPROOF_LLM_API_KEY_ENV: OPENROUTER_API_KEY
      BLASTPROOF_MAX_LLM_CALLS: ${{ inputs.max_llm_calls }}

    steps:
      - uses: actions/checkout@v7

      - name: Require an LLM key
        # This workflow never runs on a fork pull request, so a missing key is a
        # misconfiguration, not an expected condition. Failing loudly keeps the
        # badge honest: green here means the agent actually ran.
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY is not set. Add it with: gh secret set OPENROUTER_API_KEY --repo ${{ github.repository }}"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start the demo app
        run: .github/scripts/start-demo-app.sh 4173

      # Two runs with replay on, from a checkout with nothing saved and no cache
      # restored (openspec change dogfood-replays-what-passed). The cold run asks
      # the model for every step, as a run with replay off does, and saves what
      # passed; it is the one that shows the model and the provider still work,
      # which is why the replay files are never kept from one week to the next.
      # The warm run replays what the cold one saved.
      - name: Cold run, gated on the score
        run: |
          node dist/cli.js run --replay \
            --min-score "$MIN_SCORE" \
            --junit junit-cold.xml

      - name: Cold run replayed nothing
        run: node .github/scripts/replay-check.mjs cold junit-cold.xml

      - name: Restart the demo app
        # It keeps notes in memory, and the notes test checks the count.
        run: .github/scripts/start-demo-app.sh 4173

      - name: Warm run, gated on the score
        run: |
          node dist/cli.js run --replay \
            --min-score "$MIN_SCORE" \
            --junit junit-warm.xml

      - name: Warm run replayed at least half its steps
        # The score cannot show a broken replay: the model resolves every step
        # it gives up on, and the run still scores 100.
        run: node .github/scripts/replay-check.mjs warm junit-warm.xml

      - name: Upload the JUnit report
        # `always()` so a blocked run still leaves its evidence behind.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-report
          path: |
            junit-cold.xml
            junit-warm.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-screenshots
          path: .blastproof/reports/
          if-no-files-found: ignore
          retention-days: 30
