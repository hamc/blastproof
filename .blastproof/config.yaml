# blastproof configuration
# Docs: https://github.com/hamc/blastproof

# Base URL of the app under test. Relative navigate paths resolve against it.
base_url: http://localhost:4173

llm:
  # anthropic | openai | ollama
  provider: anthropic
  # Optional. Defaults: anthropic=claude-haiku-4-5, openai=gpt-4o-mini, ollama=qwen2.5
  # model: claude-haiku-4-5
  # Env var holding your API key (not needed for ollama).
  api_key_env: ANTHROPIC_API_KEY
  # Ollama only: OpenAI-compatible endpoint (http://localhost:11434/v1);
  # with provider "openai" it enables compatible gateways, e.g. OpenRouter:
  # base_url: https://openrouter.ai/api/v1   (model e.g. anthropic/claude-haiku-4.5)
  # base_url: http://localhost:11434/v1

browser:
  headless: true
  timeout_ms: 30000

# Budget of self-healing retries per step (element re-resolution via accessibility tree).
# max_retries_per_step: 3

# Impact hints mapping file globs to routes (used by `blastproof run --impacted`).
# This repo dogfoods against examples/demo-app, so the globs map the demo files:
routes:
  "examples/demo-app/login.html": ["/login"]
  "examples/demo-app/cart.html": ["/cart", "/checkout"]
  "examples/demo-app/index.html": ["/"]
  "examples/demo-app/checkout.html": ["/checkout"]
  "examples/demo-app/orders.html": ["/orders"]
  "examples/demo-app/account.html": ["/account"]
  # The one flow with a genuine server-side round trip (POST -> delay -> 302),
  # added to reproduce the false-FAIL class from #25 in our own dogfooding.
  "examples/demo-app/support.html": ["/support"]
  "examples/demo-app/support-sent.html": ["/support"]
  # The one page whose mutation redirects back to itself, added to reproduce the
  # duplicate-write class from #28 (a submit that erases its own evidence).
  "examples/demo-app/notes.html": ["/notes"]
  # The obstruction fixture (name-what-blocks-the-click, task 5.1): a consent wall
  # Escape cannot close, over the ordinary product page. It exists to make an
  # interception deterministic, which is why it is a route of its own rather than
  # a variant of index.html.
  "examples/demo-app/consent.html": ["/consent.html"]
  # Shared across every page: app.js holds all the business logic, style.css the
  # layout, serve.mjs the routing. A change to any of them can break any journey,
  # so each maps to the whole surface rather than to one page.
  "examples/demo-app/app.js": ["/", "/login", "/cart", "/checkout", "/orders", "/account", "/support", "/notes"]
  "examples/demo-app/style.css": ["/", "/login", "/cart", "/checkout", "/orders", "/account", "/support", "/notes"]
  "examples/demo-app/serve.mjs": ["/", "/login", "/cart", "/checkout", "/orders", "/account", "/support", "/notes"]

# Files that cannot affect any page in the demo app.
ignore:
  # This project's own source cannot affect the demo app under test, but it must
  # be classified: an unclassified file is exactly what --fail-on-unmapped exists
  # to catch, and leaving src/ out made this repo the live example of that gap.
  - "src/**"
  - "action.yml"
  - "package.json"
  - "package-lock.json"
  - "tsconfig.json"
  - "tsconfig.typecheck.json"
  - "tsup.config.ts"
  - "vitest.config.ts"
  - ".gitignore"
  - ".claude/**"
  - "**/*.md"
  - "docs/**"
  - ".github/**"
  - "LICENSE"
  - "openspec/**"
  - "tests/**"
  - ".blastproof/**"

# The demo shop keeps a session in localStorage, so /orders and /account are only
# reachable signed in. This recipe signs in once per run and every test reuses it.
# The demo credentials are public on purpose; in a real project use {{env.VAR}}
# placeholders, which are masked in all output.
auth:
  steps:
    - navigate to /login
    - fill the email field with demo@blastproof.dev
    - fill the password field with demo123
    - submit the login form
  verify: the page shows a welcome heading for the signed-in user
